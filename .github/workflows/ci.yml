name: CI

# M-12: Menambahkan CI gate untuk pengujian frontend (Vitest), dengan type-check dijalankan sebagai pemeriksaan informatif agar tidak memblokir PR akibat error tipe yang sudah ada sebelumnya.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true
